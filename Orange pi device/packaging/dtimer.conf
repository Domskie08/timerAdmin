# DTimer WiFi Orange Pi service defaults.
# The Debian post-install script sets this file to root-only permissions.

DTIMER_HOST=0.0.0.0
DTIMER_PORT=8080
DTIMER_DATA_DIR=/var/lib/dtimer-orange-pi

# Software update discovery.
DTIMER_UPDATE_BASE_URL=https://dtimerapp.online
DTIMER_USB_UPDATE_PATHS=/media,/mnt,/run/media

# Keep real network enforcement disabled until local setup is complete.
DTIMER_ENFORCE_NETWORK=0

# Default wiring:
# - built-in Orange Pi LAN port to ISP/router
# - USB-to-LAN adapter to customer AP/switch
# "auto" follows the default route for WAN and detects the customer adapter
# from its USB sysfs path. Set an explicit interface only when multiple USB
# network adapters are connected.
DTIMER_CONFIGURE_CUSTOMER_LAN=1
DTIMER_CUSTOMER_INTERFACE_WAIT_SECONDS=30
DTIMER_CUSTOMER_INTERFACE=auto
DTIMER_WAN_INTERFACE=auto

# Optional helper script defaults for the customer/output side.
DTIMER_CUSTOMER_ADDRESS=10.0.0.1/20
DTIMER_CUSTOMER_NETMASK=255.255.240.0
DTIMER_DHCP_RANGE_START=10.0.0.10
DTIMER_DHCP_RANGE_END=10.0.15.254
DTIMER_DHCP_LEASE_TIME=12h
